services:
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: nutrimetrics-libretranslate
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      LT_DISABLE_WEB_UI: "true"
      LT_LOAD_ONLY: en,es
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/languages', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s

  mysql:
    image: mysql:8.4
    container_name: nutrimetrics-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass_local_only}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nutrimetrics_calorietracking}
    ports:
      - "3306:3306"
    volumes:
      - nutrimetrics_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root_pass_local_only}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nutrimetrics-api
    restart: unless-stopped
    depends_on:
      libretranslate:
        condition: service_healthy
      mysql:
        condition: service_healthy

      otel-collector:
        condition: service_started

    ports:
      - "8080:8080"

    
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-nutrimetrics_calorietracking};User=root;Password=${MYSQL_ROOT_PASSWORD:-root_pass_local_only};
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-NutriMetrics.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-NutriMetrics.Client}
      Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES:-60}
      CalorieNinjas__ApiKey: ${CALORIE_NINJAS_API_KEY}
      Translation__LibreTranslate__BaseUrl: ${LIBRETRANSLATE_BASE_URL:-http://libretranslate:5000}
      Translation__LibreTranslate__ApiKey: ${LIBRETRANSLATE_API_KEY:-}
      Seed__EnableTestUser: ${SEED_ENABLE_TEST_USER:-true}
      Seed__TestUser__Email: ${SEED_TEST_USER_EMAIL:-test.user@nutrimetrics.local}
      Seed__TestUser__Password: ${SEED_TEST_USER_PASSWORD:-Test1234!}
      Otel__Endpoint: http://otel-collector:4317

  web:
    build:
      context: ./src/Web
      dockerfile: Dockerfile
    container_name: nutrimetrics-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://api:8080
    volumes:
      - ./src/Web:/app
      - /app/node_modules

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./docker/observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo
      - loki

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker/observability/tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200"

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./docker/observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  nutrimetrics_mysql_data:
